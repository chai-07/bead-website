function initMardFullGrid(){
    var grid=document.getElementById('mardFullGrid');
    grid.innerHTML='';
    for(var i=0;i<MARD_COLORS.length;i++){
        var mc=MARD_COLORS[i];
        var item=document.createElement('div');
        item.className='mard-full-item';
        item.title=mc.id+' '+mc.name;
        item.innerHTML='<div class="mard-full-swatch" style="background:rgb('+mc.rgb.join(',')+')"></div><div class="mard-full-label">'+mc.id+'</div>';
        item.dataset.index=i;
        item.addEventListener('click',function(e){
            if(eyedropperActive){toggleEyedropper();return}
            var idx=parseInt(this.dataset.index);
            selectBrush(idx);
        });
        grid.appendChild(item);
    }
    // 默认选H19黑色
    var blackIdx=-1;
    for(var i=0;i<MARD_COLORS.length;i++){if(MARD_COLORS[i].id==='H19'){blackIdx=i;break;}}
    selectBrush(blackIdx>=0?blackIdx:0);
}
function selectBrush(idx){

    document.getElementById('brushColorDisplay').textContent=MARD_COLORS[idx].id+' '+MARD_COLORS[idx].name;
    document.getElementById('mardCodeInput').value=MARD_COLORS[idx].id;
    document.querySelectorAll('.mard-full-item').forEach(function(c){c.classList.remove('active');});

function processImage(){
    showLoading('处理中...');
    setTimeout(function(){
        try{
            var du=parseInt(document.getElementById('darkUnify').value);
            var cs=parseInt(document.getElementById('canvasSize').value);
            var bt=parseInt(document.getElementById('blackThreshold').value);
            var gm=parseInt(document.getElementById('gamma').value)/100;
            var sat=parseInt(document.getElementById('saturation').value)/100;
            var con=parseInt(document.getElementById('contrast').value);
            var bri=parseInt(document.getElementById('brightness').value);
            var shp=parseInt(document.getElementById('sharpen').value);
            var den=parseInt(document.getElementById('denoise').value);
            var mc=parseInt(document.getElementById('maxColors').value);
            var sg=document.getElementById('showGrid').value==='yes';
            var gc=document.getElementById('gridColor').value;
            var enhanced=applyEnhanceOnOriginal(originalImage,du,bt,gm,sat,con,bri,shp,den);
            var scaled=nearestNeighborScale(enhanced,cs);
            var result=mardQuantize(scaled,mc);
            var quantized=result.canvas;
            colorPalette=result.palette;
            quantized=lineRepair(quantized,cs);
            gridW=cs;gridH=cs;
            gridData=getGridData(quantized,cs);
            undoStack=[];
            rerender();
            document.getElementById('downloadBtn').disabled=false;
            document.getElementById('downloadCodeBtn').disabled=false;
            hideLoading();
        }catch(e){console.error(e);hideLoading();alert('处理失败: '+e.message);}
    },100);
}

function mardQuantize(sc, maxColors){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');
    c.width=sc.width;c.height=sc.height;ctx.drawImage(sc,0,0);
    var id=ctx.getImageData(0,0,c.width,c.height),p=id.data;
    var freq={};
    for(var i=0;i<p.length;i+=4){
        if(p[i+3]<128)continue;
        var best=0,bd=Infinity;
        for(var j=0;j<MARD_COLORS.length;j++){var d=weightedLabDist([p[i],p[i+1],p[i+2]],MARD_COLORS[j].rgb);if(d<bd){bd=d;best=j;}}
        freq[best]=(freq[best]||0)+1;
    }
    var sorted=Object.entries(freq).sort(function(a,b){return b[1]-a[1];});
    var limited=sorted.slice(0,Math.min(maxColors,sorted.length)).map(function(e){return parseInt(e[0]);});
    for(var i=0;i<p.length;i+=4){
        if(p[i+3]<128)continue;
        var best=0,bd=Infinity;
        for(var j=0;j<limited.length;j++){
            var d=weightedLabDist([p[i],p[i+1],p[i+2]],MARD_COLORS[limited[j]].rgb);
            if(d<bd){bd=d;best=limited[j];}
        }
        p[i]=MARD_COLORS[best].rgb[0];p[i+1]=MARD_COLORS[best].rgb[1];p[i+2]=MARD_COLORS[best].rgb[2];
    }
    ctx.putImageData(id,0,0);
    var paletteRgb=[];
    for(var i=0;i<limited.length;i++){paletteRgb.push(MARD_COLORS[limited[i]].rgb);}
    return{canvas:c,palette:paletteRgb};
}

function applyEnhanceOnOriginal(img,du,bt,gm,sat,con,bri,shp,den){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');
    c.width=img.width;c.height=img.height;ctx.drawImage(img,0,0);
    if(den>0){c=denoise(c,den);ctx=c.getContext('2d')}
    var id=ctx.getImageData(0,0,c.width,c.height),p=id.data;
    for(var i=0;i<p.length;i+=4){
        var r=p[i],g=p[i+1],b=p[i+2];if(p[i+3]<128)continue;
        if(du>0){var lum=0.299*r+0.587*g+0.114*b;if(lum<du){p[i]=0;p[i+1]=0;p[i+2]=0;continue}}
        var rf=r/255,gf=g/255,bf=b/255;
        if(bt>0){var t=bt/100;rf=blackLift(rf,t);gf=blackLift(gf,t);bf=blackLift(bf,t)}
        if(gm!==1){rf=Math.pow(rf,1/gm);gf=Math.pow(gf,1/gm);bf=Math.pow(bf,1/gm)}
        if(sat!==1){var gy=0.299*rf+0.587*gf+0.114*bf;rf=c01(gy+sat*(rf-gy));gf=c01(gy+sat*(gf-gy));bf=c01(gy+sat*(bf-gy))}
        if(con!==100){var f=(259*(con+255))/(255*(259-con));rf=c01(f*(rf-0.5)+0.5);gf=c01(f*(gf-0.5)+0.5);bf=c01(f*(bf-0.5)+0.5)}
        if(bri!==0){var bv=bri/100;rf=c01(rf+bv);gf=c01(gf+bv);bf=c01(bf+bv)}
        p[i]=Math.round(c01(rf)*255);p[i+1]=Math.round(c01(gf)*255);p[i+2]=Math.round(c01(bf)*255);
    }
    ctx.putImageData(id,0,0);if(shp>0)c=sharpen(c,shp);return c;
}
function blackLift(v,t){return v<t?v*v/t:(v-t)/(1-t)}
function c01(v){return Math.max(0,Math.min(1,v))}
function nearestNeighborScale(sc,ts){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');
    c.width=ts;c.height=ts;ctx.imageSmoothingEnabled=false;
    var size=Math.min(sc.width,sc.height),sx=Math.floor((sc.width-size)/2),sy=Math.floor((sc.height-size)/2);
    ctx.drawImage(sc,sx,sy,size,size,0,0,ts,ts);return c;
}
function denoise(sc,str){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=sc.width;c.height=sc.height;ctx.drawImage(sc,0,0);
    var id=ctx.getImageData(0,0,c.width,c.height),w=c.width,h=c.height,src=id.data,dst=new Uint8ClampedArray(src),r=Math.min(str,2);
    for(var y=r;y<h-r;y++)for(var x=r;x<w-r;x++)for(var ch=0;ch<3;ch++){
        var vals=[];for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++)vals.push(src[((y+dy)*w+(x+dx))*4+ch]);
        vals.sort(function(a,b){return a-b});dst[(y*w+x)*4+ch]=vals[Math.floor(vals.length/2)];
    }
    for(var i=0;i<src.length;i++)src[i]=dst[i];ctx.putImageData(id,0,0);return c;
}
function sharpen(sc,str){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=sc.width;c.height=sc.height;ctx.drawImage(sc,0,0);
    var id=ctx.getImageData(0,0,c.width,c.height),w=c.width,h=c.height,src=id.data,dst=new Uint8ClampedArray(src),f=str/10,k=[0,-f,0,-f,1+4*f,-f,0,-f,0];
    for(var y=1;y<h-1;y++)for(var x=1;x<w-1;x++)for(var ch=0;ch<3;ch++){
        var idx=(y*w+x)*4+ch,sum=0;for(var ky=-1;ky<=1;ky++)for(var kx=-1;kx<=1;kx++)sum+=k[(ky+1)*3+(kx+1)]*src[((y+ky)*w+(x+kx))*4+ch];
        dst[idx]=Math.max(0,Math.min(255,Math.round(sum)));
    }
    for(var i=0;i<src.length;i++)src[i]=dst[i];ctx.putImageData(id,0,0);return c;
}
function rgb2lab(rgb){
    var r=rgb[0]/255,g=rgb[1]/255,b=rgb[2]/255;
    r=r>0.04045?Math.pow((r+0.055)/1.055,2.4):r/12.92;g=g>0.04045?Math.pow((g+0.055)/1.055,2.4):g/12.92;b=b>0.04045?Math.pow((b+0.055)/1.055,2.4):b/12.92;
    var x=(r*0.4124+g*0.3576+b*0.1805)/0.95047,y=(r*0.2126+g*0.7152+b*0.0722)/1.0,z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
    var fx=x>0.008856?Math.cbrt(x):(903.3*x+16)/116,fy=y>0.008856?Math.cbrt(y):(903.3*y+16)/116,fz=z>0.008856?Math.cbrt(z):(903.3*z+16)/116;
    return[116*fy-16,500*(fx-fy),200*(fy-fz)];
}
function weightedLabDist(rgb1,rgb2){
    var l1=rgb2lab(rgb1),l2=rgb2lab(rgb2);var dl=l1[0]-l2[0],da=l1[1]-l2[1],db=l1[2]-l2[2];
    return Math.sqrt(dl*dl+2.2*da*da+2.2*db*db);
}
function lineRepair(sc,gs){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=gs;c.height=gs;ctx.drawImage(sc,0,0);
    var id=ctx.getImageData(0,0,gs,gs),p=id.data;
    for(var y=1;y<gs-1;y++){for(var x=1;x<gs-1;x++){
        var idx=(y*gs+x)*4;var r=p[idx],g=p[idx+1],b=p[idx+2];if(r===0&&g===0&&b===0)continue;
        var bc=0,wc=0;
        for(var dy=-1;dy<=1;dy++){for(var dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;var nidx=((y+dy)*gs+(x+dx))*4;
            var nr=p[nidx],ng=p[nidx+1],nb=p[nidx+2];
            if(nr===0&&ng===0&&nb===0)bc++;if(nr===255&&ng===255&&nb===255)wc++;
        }}
        if(bc>=5&&wc<=1){p[idx]=0;p[idx+1]=0;p[idx+2]=0;}
    }}
    ctx.putImageData(id,0,0);return c;
}
function getGridData(sc,gs){
    var ctx=sc.getContext('2d');var id=ctx.getImageData(0,0,gs,gs),p=id.data;
    var data=[];for(var y=0;y<gs;y++){data[y]=[];for(var x=0;x<gs;x++){var idx=(y*gs+x)*4;data[y][x]=[p[idx],p[idx+1],p[idx+2],p[idx+3]]}}
    return data;
}
function findMardId(rgb){
    var best=null,bd=Infinity;
    for(var j=0;j<MARD_COLORS.length;j++){var d=weightedLabDist(rgb,MARD_COLORS[j].rgb);if(d<bd){bd=d;best=MARD_COLORS[j];}}
    return best?best.id:'??';
}
function removeSingles(){
    if(!gridData)return;saveUndo();
    var w=gridData[0].length,h=gridData.length,changed=0;
    for(var y=0;y<h;y++){for(var x=0;x<w;x++){
        var color=gridData[y][x];var sn=0,dc=null;
        for(var dy=-1;dy<=1;dy++){for(var dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;var nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;
            var nc=gridData[ny][nx];if(nc[0]===color[0]&&nc[1]===color[1]&&nc[2]===color[2])sn++;else dc=nc;
        }}
        if(sn===0&&dc){gridData[y][x]=[dc[0],dc[1],dc[2],255];changed++;}
    }}
    if(changed>0)rerender();document.getElementById('pixelInfo').textContent='清除 '+changed+' 个孤立点';
}
function saveUndo(){
    if(!gridData)return;var copy=[];
    for(var y=0;y<gridData.length;y++){copy[y]=[];for(var x=0;x<gridData[y].length;x++){copy[y][x]=gridData[y][x].slice()}}
    undoStack.push(copy);if(undoStack.length>20)undoStack.shift();
}
function undoBrush(){
    if(undoStack.length===0){document.getElementById('pixelInfo').textContent='无可撤回';return}
    gridData=undoStack.pop();rerender();document.getElementById('pixelInfo').textContent='已撤回('+undoStack.length+'步)';
}
function getColorListText(){
    var counts={},idMap={};
    for(var y=0;y<gridData.length;y++){for(var x=0;x<gridData[y].length;x++){
        var c=gridData[y][x];var key=c[0]+','+c[1]+','+c[2];counts[key]=(counts[key]||0)+1;if(!idMap[key])idMap[key]=findMardId(c);
    }}
    var sorted=Object.entries(counts).sort(function(a,b){return b[1]-a[1];});
    var lines=[];for(var i=0;i<sorted.length;i++){var rgb=sorted[i][0].split(',').map(Number);var count=sorted[i][1];lines.push({id:idMap[sorted[i][0]],count:count,rgb:rgb});}
    return lines;
}
function drawGridFromData(gs,sg,gc){
    var c=document.createElement('canvas'),ctx=c.getContext('2d');var margin=40,cs=30;
    var cl=getColorListText();var lh=cl.length*22+30;
    var tw=gs*cs+margin*2,th=gs*cs+margin*2+lh;
    c.width=tw;c.height=th;ctx.fillStyle='#fff';ctx.fillRect(0,0,tw,th);ctx.imageSmoothingEnabled=false;
    for(var y=0;y<gs;y++){for(var x=0;x<gs;x++){
        var clr=gridData[y][x];ctx.fillStyle='rgb('+clr[0]+','+clr[1]+','+clr[2]+')';ctx.fillRect(margin+x*cs,margin+y*cs,cs,cs);
        if(sg){ctx.strokeStyle=gc;ctx.lineWidth=0.5;ctx.strokeRect(margin+x*cs,margin+y*cs,cs,cs);}
        if(showCodes){var mid=findMardId(clr);var lum=0.299*clr[0]+0.587*clr[1]+0.114*clr[2];ctx.fillStyle=lum>128?'#000':'#fff';ctx.font='9px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(mid,margin+x*cs+cs/2,margin+y*cs+cs/2);}
    }}
    ctx.fillStyle='#333';ctx.font='10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    for(var x=0;x<gs;x++){ctx.fillText(x+1,margin+x*cs+cs/2,margin/2);ctx.fillText(x+1,margin+x*cs+cs/2,th-lh-margin/2);}
    ctx.textAlign='right';for(var y=0;y<gs;y++){ctx.fillText(y+1,margin-5,margin+y*cs+cs/2);}
    ctx.textAlign='left';for(var y=0;y<gs;y++){ctx.fillText(y+1,tw-margin+5,margin+y*cs+cs/2);}
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(margin,margin,gs*cs,gs*cs);
    var ly=gs*cs+margin+15;ctx.font='bold 13px monospace';ctx.fillStyle='#222';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('色号',margin,ly);ctx.fillText('色卡',margin+60,ly);ctx.fillText('数量',margin+160,ly);ly+=22;
    for(var i=0;i<cl.length;i++){var item=cl[i];ctx.font='12px monospace';ctx.fillStyle='#222';ctx.fillText(item.id,margin,ly+3);ctx.fillStyle='rgb('+item.rgb.join(',')+')';ctx.fillRect(margin+55,ly,20,18);ctx.strokeStyle='#999';ctx.strokeRect(margin+55,ly,20,18);ctx.fillStyle='#222';ctx.fillText('×'+item.count,margin+85,ly+3);ly+=22;}
    ctx.fillStyle='#e94560';ctx.font='bold 12px monospace';ctx.fillText('共 '+cl.length+' 色 | 总计 '+gs*gs+' 颗',margin,ly+5);
    return c;
}
function rerender(){var sg=document.getElementById('showGrid').value==='yes',gc=document.getElementById('gridColor').value;var fin=drawGridFromData(gridW,sg,gc);displayResult(fin);}
function displayResult(rc){var el=document.getElementById('resultCanvas');el.width=rc.width;el.height=rc.height;el.getContext('2d').drawImage(rc,0,0);document.getElementById('resultPlaceholder').style.display='none';displayScale=30;}
function downloadResult(){showCodes=false;rerender();var l=document.createElement('a');l.download='bead_effect_'+new Date().toISOString().slice(0,10)+'.png';l.href=document.getElementById('resultCanvas').toDataURL('image/png');l.click();showCodes=document.getElementById('showColorCodes').checked;rerender();}
function downloadCodeResult(){showCodes=true;rerender();setTimeout(function(){var l=document.createElement('a');l.download='bead_codes_'+new Date().toISOString().slice(0,10)+'.png';l.href=document.getElementById('resultCanvas').toDataURL('image/png');l.click();showCodes=document.getElementById('showColorCodes').checked;rerender();},200);}

document.getElementById('resultCanvas').addEventListener('click',function(e){
    if(!gridData)return;var rect=this.getBoundingClientRect(),sx=this.width/rect.width;
    var mx=e.clientX-rect.left,my=e.clientY-rect.top;var margin=40,cs=30;
    var gx=Math.floor((mx*sx-margin)/cs),gy=Math.floor((my*sx-margin)/cs);
    if(gx<0||gx>=gridW||gy<0||gy>=gridH)return;
    if(eyedropperActive){var clr=gridData[gy][gx];var best=0,bd=Infinity;for(var j=0;j<MARD_COLORS.length;j++){var d=weightedLabDist(clr,MARD_COLORS[j].rgb);if(d<bd){bd=d;best=j;}}selectBrush(best);toggleEyedropper();document.getElementById('pixelInfo').textContent='取色: ('+gx+','+gy+') → '+MARD_COLORS[best].id;return;}
    saveUndo();var bs=parseInt(document.getElementById('brushSize').value);
    for(var dy=-bs+1;dy<bs;dy++)for(var dx=-bs+1;dx<bs;dx++){var nx=gx+dx,ny=gy+dy;if(nx>=0&&nx<gridW&&ny>=0&&ny<gridH)gridData[ny][nx]=[selectedBrushColor[0],selectedBrushColor[1],selectedBrushColor[2],255];}
    rerender();document.getElementById('pixelInfo').textContent='修改: ('+gx+','+gy+') → '+selectedBrushId;
});
function showLoading(t){document.getElementById('loadingOverlay').style.display='flex';document.getElementById('loadingText').textContent=t}
function hideLoading(){document.getElementById('loadingOverlay').style.display='none'}
