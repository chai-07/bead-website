<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级拼豆图纸生成器 - 选择版本</title>
    <link rel="stylesheet" href="css/choose.css">
</head>
<body>
<div id="versionChooser">
  <div class="vc-card">
    <h1>🎨 超级拼豆图纸生成器</h1>
    <p class="vc-sub">请选择使用版本</p>
    <div class="vc-options">
      <div class="vc-btn" data-mode="desktop">
        <div class="vc-ico">💻</div>
        <div class="vc-txt"><b>电脑版<span class="vc-reco">推荐</span></b><span>大屏操作 · 功能完整 · 三栏布局</span></div>
      </div>
      <div class="vc-btn" data-mode="mobile">
        <div class="vc-ico">📱</div>
        <div class="vc-txt"><b>手机版<span class="vc-reco">推荐</span></b><span>触屏优化 · 画布为主角 · 底部工具栏 · 弹出式面板</span></div>
      </div>
    </div>
    <label class="vc-foot"><input type="checkbox" id="vcRemember"> 记住我的选择（下次直接进入）</label>
  </div>
</div>
<script>
(function(){
  var KEY_R='bead_version_remember', KEY_V='bead_version';
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
  var remember=lsGet(KEY_R)==='1';
  var saved=lsGet(KEY_V);
  var isSmall=window.innerWidth<1200;
  var reco=isSmall?'mobile':'desktop';
  var def=saved||reco;
  var chooser=document.getElementById('versionChooser');
  chooser.querySelectorAll('.vc-btn').forEach(function(b){
    b.classList.toggle('selected',b.dataset.mode===def);
    var r=b.querySelector('.vc-reco'); if(r)r.style.display=(b.dataset.mode===reco)?'inline-block':'none';
  });
  document.getElementById('vcRemember').checked=remember;
  function go(mode){ location.href='app.html?mode='+mode; }
  chooser.querySelectorAll('.vc-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var mode=b.dataset.mode;
      if(document.getElementById('vcRemember').checked){lsSet(KEY_R,'1');lsSet(KEY_V,mode);}else{lsDel(KEY_R);lsDel(KEY_V);}
      go(mode);
    });
  });
  if(remember&&saved&&!new URLSearchParams(location.search).get('choose')){ go(saved); }
})();
</script>
</body>
</html>
